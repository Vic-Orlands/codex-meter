name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: swift test
      - run: Scripts/build-app.sh

  cli:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m unittest Tests/cli_test.py
      - run: python3 -m py_compile cli/codex-meter
